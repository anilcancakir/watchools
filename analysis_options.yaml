# Static analysis for the Flutter half of Watchools.
#
# The rules below encode the house style rather than restating Dart defaults:
# type everything, 120 columns, multi-line collections with trailing commas,
# and no suppressions. `flutter analyze` is the gate, so anything that would
# only ever be a warning in an IDE is escalated to an error here.

include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    # Committed so the Flutter tool stops re-adding it on every `pub get`.
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
    # Generated barrels. Regenerated by artisan, never hand-edited.
    - "**/*.g.dart"
    # The Laravel half. Nothing here is Dart, and leaving it in makes the
    # analysis server watch ten thousand vendor files for nothing.
    - backend/**

  language:
    # "Type everything" as a compiler setting rather than a review comment.
    # strict-casts kills implicit downcasts from dynamic, strict-inference
    # kills silently-inferred dynamic, strict-raw-types kills bare List/Map.
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

  errors:
    # CI runs `flutter analyze --fatal-infos --fatal-warnings`, which already
    # makes every diagnostic below fatal at its natural severity. These entries
    # exist so a local `flutter analyze` without the flags fails the same way,
    # and so the intent survives someone relaxing the CI flags.
    #
    # `missing_return` is deliberately absent: the analyzer removed that code
    # and silently ignores it. Its live replacement, `body_might_complete_
    # normally`, is already an error.
    unnecessary_ignore: error
    unawaited_futures: error
    missing_required_param: error
    unused_import: error
    unused_local_variable: error
    dead_code: error

formatter:
  # 120, matching the house rule. `dart format` writes to this.
  page_width: 120

linter:
  rules:
    # Types
    - always_declare_return_types
    - type_annotate_public_apis
    - avoid_dynamic_calls

    # Collections and call sites, so diffs stay one line per element.
    - require_trailing_commas

    # Immutability first: the ecosystem's data classes are @immutable with
    # copyWith, and these push new code the same way.
    - prefer_final_locals
    - prefer_final_in_for_each
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_const_literals_to_create_immutables

    # Style the formatter cannot decide for us.
    - prefer_single_quotes
    - directives_ordering
    - unnecessary_parenthesis
    - avoid_redundant_argument_values

    # `public_member_api_docs` is deliberately NOT enabled. This app is
    # `publish_to: none` and has no public API, while the rule fires on the
    # class, the constructor and every public field of every widget: four to
    # six doc blocks per component, on fields whose names already say
    # everything. Under `--fatal-infos` that turns each `make:component`
    # scaffold red before a line is typed. Doc blocks that carry what the
    # signature cannot are still expected; a linter is the wrong enforcer.

    # Errors must be handled deliberately or propagate, never swallowed.
    - avoid_catches_without_on_clauses
    - only_throw_errors

    # Async correctness.
    - avoid_slow_async_io
    - cancel_subscriptions
    - close_sinks

    # A print in shipped code is a missing Log call.
    - avoid_print
