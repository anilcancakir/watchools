name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The target is 90 on both halves. The backend is there today. The Flutter
  # floor is lower because the app is a scaffold, and it ratchets up in the
  # same pull request as each screen's tests, never in one of its own.
  BACKEND_COVERAGE_MINIMUM: 90
  FLUTTER_COVERAGE_MINIMUM: 40

jobs:
  flutter:
    name: Flutter (analyze, test, coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The ecosystem packages resolve from pub.dev on CI. pubspec_overrides.yaml
      # is gitignored precisely so this job certifies the PUBLISHED wind, magic
      # and artisan rather than a working tree that only exists on one machine.
      # A red job here after a local green one means a sibling has unreleased
      # work in it; publish the sibling and bump the caret.
      # Not `flutter-version-file`: that reads `environment.flutter` from the
      # pubspec, this project declares only a Dart constraint, and the action
      # then resolves the literal string "null" and fails the step.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.x'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # `.env` is gitignored and bundled as an asset, so the build fails without
      # it. CI gets the tracked template; it carries no secret.
      - name: Provision .env
        run: cp .env.example .env

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Test with coverage
        run: flutter test --coverage

      - name: Enforce coverage minimum
        run: |
          python3 - <<'PY'
          import os, sys

          # Magic's generated scaffold is excluded from the denominator: it is
          # framework output this project did not write and will replace. Note
          # that lcov only carries files the tests actually import, so the
          # denominator moves when a test imports something new. Read the
          # printed hit/found before assuming a red run is a regression.
          EXCLUDED = (
              'lib/resources/views/',
              'lib/app/providers/',
              'lib/app/kernel.dart',
              'lib/routes/app.dart',
          )

          hit = found = 0
          current = None
          for line in open('coverage/lcov.info'):
              if line.startswith('SF:'):
                  path = line[3:].strip()
                  current = None if any(x in path for x in EXCLUDED) else path
              elif current and line.startswith('LF:'):
                  found += int(line[3:])
              elif current and line.startswith('LH:'):
                  hit += int(line[3:])

          minimum = float(os.environ['FLUTTER_COVERAGE_MINIMUM'])
          pct = 100 * hit / found if found else 0.0
          print(f'Flutter line coverage (scaffold excluded): {hit}/{found} = {pct:.1f}%, floor {minimum}%')
          if pct < minimum:
              sys.exit(f'FAIL: {pct:.1f}% is below the {minimum}% floor')
          PY

  backend:
    name: Laravel (pint, phpstan, test, coverage)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          # PCOV is faster than Xdebug for line coverage and this job needs
          # nothing else Xdebug provides.
          coverage: pcov

      # magic-starter-laravel comes from a vcs repository, so composer.lock
      # carries a git SHA that resolves anywhere. A path repository would not:
      # `composer install` reads dist.url out of the lock and ignores a
      # repointed repository entirely, so the install would silently look for
      # a directory that only exists on one machine.
      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Provision .env
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Lint
        run: vendor/bin/pint --test

      - name: Static analysis
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

      - name: Test with coverage
        run: php artisan test --coverage --min=${{ env.BACKEND_COVERAGE_MINIMUM }}
