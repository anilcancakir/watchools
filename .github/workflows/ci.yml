name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The target is 90 on both halves and both halves are there. The Flutter side
  # ratcheted from 40 in the pull request that added the line-up and catalogue
  # screens, which is the rule: a floor moves with the tests that earned it,
  # never in a commit of its own. Measured at 95.4% when this was set.
  BACKEND_COVERAGE_MINIMUM: 90
  FLUTTER_COVERAGE_MINIMUM: 90

jobs:
  flutter:
    name: Flutter (analyze, test, coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The ecosystem packages resolve from pub.dev on CI. pubspec_overrides.yaml
      # is gitignored precisely so this job certifies the PUBLISHED wind, magic
      # and artisan rather than a working tree that only exists on one machine.
      # A red job here after a local green one means a sibling has unreleased
      # work in it; publish the sibling and bump the caret.
      # Not `flutter-version-file`: that reads `environment.flutter` from the
      # pubspec, this project declares only a Dart constraint, and the action
      # then resolves the literal string "null" and fails the step.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.x'
          cache: true

      # Before `pub get`, which is the only moment the committed file is still
      # the committed file: `pub get` re-resolves an unusable lock rather than
      # failing on it, so every gate after this point passes over a lock that
      # names paths from one developer's machine. One such lock reached master
      # carrying seven `source: path` entries under /Users/, and the whole
      # pipeline went green.
      # The check is on `relative: false`, not on `source: path`. A package that
      # lives in this repository under packages/ is a legitimate path
      # dependency and pub records it as relative, so it resolves on any
      # machine; a sibling resolved through pubspec_overrides.yaml is recorded
      # absolute, under one developer's home directory, and resolves nowhere
      # else. Counting the two is how an older lock entry that carries no
      # `relative` key at all is caught rather than waved through.
      - name: Check the lock names no machine-specific path
        run: |
          set -euo pipefail
          paths=$(grep -c 'source: path' pubspec.lock || true)
          relative=$(grep -c 'relative: true' pubspec.lock || true)
          if [ "$paths" != "$relative" ]; then
            echo "pubspec.lock carries $paths path dependencies of which only $relative are relative:"
            grep -B6 'source: path' pubspec.lock
            echo
            echo "Regenerate it without the overrides active:"
            echo "  mv pubspec_overrides.yaml /tmp/ && flutter pub get && git add pubspec.lock"
            echo "  mv /tmp/pubspec_overrides.yaml . && flutter pub get"
            exit 1
          fi

      - name: Install dependencies
        run: flutter pub get

      # `.env` is gitignored and bundled as an asset, so the build fails without
      # it. CI gets the tracked template; it carries no secret.
      - name: Provision .env
        run: cp .env.example .env

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze --fatal-infos --fatal-warnings

      # The root analysis excludes packages/, because recursing into a plugin's
      # example app finds `package:` imports that are unresolved until somebody
      # runs `pub get` inside it. So each package is resolved and analysed on
      # its own here, and the exclusion narrows the root gate instead of
      # dropping one. A package whose own analysis is red fails this job.
      - name: Analyze the packages
        run: |
          set -euo pipefail
          shopt -s nullglob
          for manifest in packages/*/pubspec.yaml; do
            package="$(dirname "$manifest")"
            echo "::group::$package"
            flutter pub get --directory "$package"
            if [ -f "$package/example/pubspec.yaml" ]; then
              flutter pub get --directory "$package/example"
            fi
            (cd "$package" && flutter analyze --fatal-infos --fatal-warnings)
            # The root format step covers lib and test only, so without this a
            # package's own Dart is formatted by nothing.
            (cd "$package" && dart format --output=none --set-exit-if-changed lib example/lib)
            if [ -d "$package/test" ]; then
              (cd "$package" && dart format --output=none --set-exit-if-changed test)
              (cd "$package" && flutter test)
            fi
            echo "::endgroup::"
          done

      - name: Test with coverage
        run: flutter test --coverage

      - name: Enforce coverage minimum
        run: |
          python3 - <<'PY'
          import os, sys

          # Magic's generated scaffold is excluded from the denominator: it is
          # framework output this project did not write and will replace. Note
          # that lcov only carries files the tests actually import, so the
          # denominator moves when a test imports something new. Read the
          # printed hit/found before assuming a red run is a regression.
          EXCLUDED = (
              'lib/resources/views/',
              'lib/app/providers/',
              'lib/app/kernel.dart',
              'lib/routes/app.dart',
          )

          hit = found = 0
          current = None
          for line in open('coverage/lcov.info'):
              if line.startswith('SF:'):
                  path = line[3:].strip()
                  current = None if any(x in path for x in EXCLUDED) else path
              elif current and line.startswith('LF:'):
                  found += int(line[3:])
              elif current and line.startswith('LH:'):
                  hit += int(line[3:])

          minimum = float(os.environ['FLUTTER_COVERAGE_MINIMUM'])
          pct = 100 * hit / found if found else 0.0
          print(f'Flutter line coverage (scaffold excluded): {hit}/{found} = {pct:.1f}%, floor {minimum}%')
          if pct < minimum:
              sys.exit(f'FAIL: {pct:.1f}% is below the {minimum}% floor')
          PY

  backend:
    name: Laravel (pint, phpstan, test, coverage)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          # PCOV is faster than Xdebug for line coverage and this job needs
          # nothing else Xdebug provides.
          coverage: pcov

      # magic-starter-laravel comes from a vcs repository, so composer.lock
      # carries a git SHA that resolves anywhere. A path repository would not:
      # `composer install` reads dist.url out of the lock and ignores a
      # repointed repository entirely, so the install would silently look for
      # a directory that only exists on one machine.
      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Provision .env
        run: |
          cp .env.example .env
          php artisan key:generate

      # The paths are explicit because a bare `pint --test` run from this
      # directory silently skips files: it exits 0 with a known
      # class_attributes_separation violation in app/Models/User.php that the
      # same binary reports when the path is named. Passing the paths makes the
      # local command and this one check the same set.
      - name: Lint
        run: vendor/bin/pint --test app config database routes tests

      - name: Static analysis
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

      - name: Test with coverage
        run: php artisan test --coverage --min=${{ env.BACKEND_COVERAGE_MINIMUM }}
